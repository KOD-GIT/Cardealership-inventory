server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: /floor, /vehicle/7, /ledger ... are routes handled in the browser, so a refresh or a
  # pasted link must be answered with index.html (the stock nginx config would answer 404).
  location / {
    try_files $uri /index.html;
  }

  # Built files have content hashes in their names, so they can be cached for a year.
  # A missing asset is a real 404, never index.html (that would be parsed as JavaScript and fail confusingly).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell must always be re-checked so a new deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
