[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing --cov-report=html:reports/coverage --html=reports/test-report.html --self-contained-html"

[tool.coverage.run]
omit = ["app/scripts/*", "alembic/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["UP042"]  # keep `class X(str, Enum)`: stores readable names via SQLAlchemy Enum

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `param = Depends(...)` is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
